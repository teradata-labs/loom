name: Version Consistency Check

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check-version-drift:
    name: Check Version Drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'

      - name: Verify version consistency
        run: |
          echo "Checking version consistency across all files..."
          go run ./cmd/version-manager verify

          if [ $? -ne 0 ]; then
            echo ""
            echo "::error::Version drift detected!"
            echo "::error::Run 'just version-sync' locally to fix version inconsistencies."
            exit 1
          fi

          echo "✅ All files have consistent versions!"

      - name: Show current version
        if: always()
        run: |
          VERSION=$(go run ./cmd/version-manager show)
          echo "Current canonical version: $VERSION"
