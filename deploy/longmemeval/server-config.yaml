# Template — rendered by run-500.sh (render-common.sh, allowlisted envsubst).
apiVersion: v1
kind: ConfigMap
metadata:
  name: lme-server-config
  namespace: ${LME_NAMESPACE}
data:
  looms.yaml: |
    llm:
      provider: bedrock
      bedrock_model_id: ${LME_MODEL}
      bedrock_region: us-west-2
      # bedrock_bearer_token is deliberately absent: looms reads it from the
      # LOOM_LLM_BEDROCK_BEARER_TOKEN env var (Secret lme-bedrock). The env var
      # binds because setDefaults registers llm.bedrock_bearer_token
      # (cmd/looms/config.go; pinned by TestEnvVar_LLMSecrets_NoYAMLKey). Do not
      # put a ${...} placeholder here: looms passes the token through unexpanded.
    server:
      host: 0.0.0.0
      port: ${LME_GRPC_PORT}
      # Required: the harness replays historical conversations and anchors
      # them via WeaveRequest.occurred_at.
      allow_time_override: true
    database:
      path: /var/lib/loom/loom.db
    observability:
      enabled: true
      mode: embedded
      storage_type: sqlite
      sqlite_path: /var/lib/loom/observability.db
