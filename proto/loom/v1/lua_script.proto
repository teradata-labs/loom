syntax = "proto3";

package loom.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/teradata-labs/loom/gen/go/loom/v1;loomv1";

// LuaScriptManifest describes a saved script's inputs and needs. It is
// required before the script can be published as a tool.
message LuaScriptManifest {
  // JSON Schema (type object) for the script's args when it runs as a tool.
  // At most 20 properties and 4 KiB; no $ref.
  google.protobuf.Struct parameters = 1;

  // Tool names the script calls. When set, the script may call only these.
  repeated string requires = 2;

  // One line describing the return value.
  string returns = 3;

  // Next field number: 4
}

// LuaScript is a saved Lua script that run_lua can run by name.
message LuaScript {
  // Script name: ^[a-z][a-z0-9_]{2,40}$. Unique per server.
  string name = 1;

  // One or two sentences on what the script does.
  string description = 2;

  // Lua 5.4 source. Empty in ListLuaScripts responses.
  string source = 3;

  // Inputs and needs; unset when the script has no manifest.
  LuaScriptManifest manifest = 4;

  // Incremented on every save.
  int32 version = 5;

  // Whether the script may be used as a tool named lua_<name>.
  bool published = 6;

  // The agent that saved the script, or "server" for scripts saved over RPC.
  string owner = 7;

  // When the script was last saved.
  google.protobuf.Timestamp updated_at = 8;

  // Agents that have lua_<name> attached.
  repeated string attached_agents = 9;

  // Next field number: 10
}

// ListLuaScriptsRequest lists every saved script.
message ListLuaScriptsRequest {}

// ListLuaScriptsResponse returns saved scripts, name-sorted, without source.
message ListLuaScriptsResponse {
  repeated LuaScript scripts = 1;
}

// GetLuaScriptRequest reads one saved script.
message GetLuaScriptRequest {
  string name = 1;
}

// GetLuaScriptResponse carries the script with its source.
message GetLuaScriptResponse {
  LuaScript script = 1;
}

// SaveLuaScriptRequest saves a script. The source must compile; it is never
// run by this call.
message SaveLuaScriptRequest {
  string name = 1;
  string description = 2;
  string source = 3;
  LuaScriptManifest manifest = 4;

  // Replace an existing script with the same name. Without it, a name that
  // is taken is AlreadyExists.
  bool overwrite = 5;
}

// SaveLuaScriptResponse carries the saved script.
message SaveLuaScriptResponse {
  LuaScript script = 1;

  // Whether the name was new (false: an existing script was replaced).
  bool created = 2;
}

// DeleteLuaScriptRequest deletes a saved script and its attachments.
message DeleteLuaScriptRequest {
  string name = 1;
}

// DeleteLuaScriptResponse reports whether a script was deleted.
message DeleteLuaScriptResponse {
  bool deleted = 1;
}
