name: debate_workflow
title: Debate Workflow Pattern
description: Create a debate orchestration workflow where multiple agents argue different sides of a topic over rounds and a moderator writes the synthesis.
category: weaver
difficulty: intermediate
backend_type: workflow

intents:
  - weaver
use_cases:
  - "debate between agents"
  - "argue different perspectives"
  - "discuss opposing viewpoints"
  - "reach consensus through discussion"
  - "pro vs con analysis"

parameters:
  - name: topic
    type: string
    description: The debate topic or question
    required: true
    example: "Should we adopt microservices architecture?"
  - name: agent_count
    type: integer
    description: Number of debating agents (minimum 2)
    required: false
    example: "3"
  - name: rounds
    type: integer
    description: Number of debate rounds
    required: false
    example: "3"

templates:
  workflow:
    description: Complete debate workflow YAML
    sql: |
      apiVersion: loom/v1
      kind: Workflow
      metadata:
        name: {{name}}-debate
        description: "Debate: {{topic}}"
      spec:
        type: debate
        topic: "{{topic}}"
        agent_ids:
          - advocate
          - skeptic
        rounds: {{rounds}}
        moderator_agent_id: moderator
        join:
          max_branch_bytes: 4096
          overflow_strategy: pre_reduce
  agent:
    description: Debate agent template
    sql: |
      apiVersion: loom/v1
      kind: Agent
      metadata:
        name: {{name}}
      spec:
        system_prompt: |
          Argue the {{perspective}} perspective on the given topic.
          Support your position with evidence and reasoning.
          Respond to counterarguments constructively.
        tools:
          - web_search
          - file_read

examples:
  - name: microservices_debate
    description: Debate about microservices vs monolith architecture
    input: "Create a debate about microservices"
    expected_output: |
      Workflow with type: debate, topic about microservices,
      at least 2 agents (advocate, skeptic), 3 rounds, a moderator_agent_id
      whose agent writes the synthesis, and a join block that bounds the
      synthesis and response prompts. No merge_strategy.

common_errors:
  - error: "Less than 2 agents in debate"
    cause: "Debate requires at least 2 agents with different viewpoints"
    fix: "Add at least 2 agent_ids to the debate workflow"
  - error: "Missing topic field"
    cause: "Debate workflows require a topic"
    fix: "Add 'topic: \"Your debate question\"' under spec"
  - error: "spec.merge_strategy has no effect on debate"
    cause: "merge_strategy is a fork-join/parallel field; the debate engine never read it"
    fix: "Remove merge_strategy. Set moderator_agent_id for a synthesized outcome and join: to bound it"
  - error: "spec.join.agent_id is not used by debate"
    cause: "On debate the moderator is the join agent"
    fix: "Remove join.agent_id and set moderator_agent_id instead"

best_practices: |
  - Give each agent a distinct viewpoint in their system_prompt
  - Use 3 rounds for thorough debate, fewer for quick decisions
  - Set moderator_agent_id: without a moderator the result is a one-line
    confidence summary of the last round, not a written synthesis
  - Add join: {max_branch_bytes, max_input_tokens, overflow_strategy,
    prompt_template} so the moderator's synthesis prompt and each agent's
    round 2+ response prompt stay within the receiving agent's context
    window; full positions go to SharedMemory and the agents can fetch them
    with shared_memory_read
  - Never set merge_strategy on a debate; the loader rejects it
  - Use conversation_memory to track debate progression
