---
name: guidance
namespace: loom.self_correction
---
prompts:
  - id: suggest_alternatives
    content: |
      This approach is not working. Please try:
      {{.suggestions}}
    variables:
      suggestions:
        name: suggestions
        type: 1  # STRING
        required: true
        description: "Alternative approaches to suggest"
    tags:
      - guidance
      - self_correction
    metadata:
      version: "v1.0"
      description: "Self-correction guidance prompt"

  - id: max_turns_reached
    content: |
      I apologize, but I've reached my processing limit. Please try rephrasing your request or breaking it into smaller steps.
    tags:
      - guidance
      - limits
    metadata:
      version: "v1.0"
      description: "Maximum turns limit message"

  - id: llm_call_failed
    content: |
      I encountered an error while processing your request. Please try again or rephrase your question.
    tags:
      - guidance
      - error_recovery
    metadata:
      version: "v1.0"
      description: "LLM call failure recovery message"

  - id: tool_execution_failed
    content: |
      The tool execution failed: {{.error}}. Let me try a different approach.
    variables:
      error:
        name: error
        type: 1  # STRING
        required: true
        description: "Error message from tool execution"
    tags:
      - guidance
      - tool_error
    metadata:
      version: "v1.0"
      description: "Tool execution failure recovery"

  - id: repeated_tool_call
    content: |
      (note: this is call {{.count}} in a row to {{.tool_name}} with identical arguments. Read this result before calling again: change the arguments, try a different approach, or finish. Calling again is fine when the data can change between calls, for example when polling a job that is still running.)
    variables:
      count:
        name: count
        type: 1  # STRING
        required: true
        description: "Number of consecutive identical calls"
      tool_name:
        name: tool_name
        type: 1  # STRING
        required: true
        description: "Name of the repeated tool"
    tags:
      - guidance
      - self_correction
    metadata:
      version: "v1.0"
      description: "Advisory note after repeated identical tool calls"

  - id: step_results_too_large
    content: |
      These {{.count}} tool results, from one step, were together too large for the context, so they were removed. Each call ran: do not repeat an action that changed something. Call fewer tools at once, or narrow each call (a range, a filter, LIMIT), and continue.
    variables:
      count:
        name: count
        type: 1  # STRING
        required: true
        description: "Number of tool results the step returned"
    tags:
      - guidance
      - self_correction
    metadata:
      version: "v1.0"
      description: "A step whose results together did not fit the context: replaced, and the model re-plans"

  - id: step_results_too_large_at_synthesis
    content: |
      These {{.count}} tool results, from the last step, were together too large for the context, so they were removed. Each call ran. Answer from what you had before them, and say which of these results you could not read.
    variables:
      count:
        name: count
        type: 1  # STRING
        required: true
        description: "Number of tool results the step returned"
    tags:
      - guidance
      - self_correction
    metadata:
      version: "v1.0"
      description: "The last step's results did not fit the final answer's send: replaced, and the model answers from what it had"
