---
name: tools
namespace: loom
---
prompts:
  - id: query_tool_result
    content: |
      Read the full data of a large tool result FROM THIS TURN, by the tool_use_id named
      in its truncation tail (or a message_id a host shows). Data is held in memory only
      within the turn that produced it — never use an id from an earlier turn; re-run the
      producing tool instead. (tool_use_id, offset, limit) returns bounded pages.
    tags:
      - tool
      - query
      - pagination
    metadata:
      version: "v3.0"
      description: "This turn's memory, nothing else (HLD §7.1)"

  - id: recall
    content: |
      Retrieve conversation that is no longer shown, by an address cited in the
      session summary: recall("msg:41-78") returns those messages as stored;
      recall("msg:41") is the single-message form. Tool results are not included —
      re-run the producing call for data. Returns are bounded; a cut range prints
      the exact next call.
    tags:
      - tool
      - recall
      - conversation
    metadata:
      version: "v1.0"
      description: "Summary-cited conversation retrieval (HLD §6)"
