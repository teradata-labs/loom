---
name: tools
namespace: loom.shell
---
prompts:
  - id: shell_execute
    content: |
      Run shell commands. One call can run up to 5: pass `commands` (an
      array) and they run in PARALLEL, each in its own shell — `cd` and
      variables do NOT carry between them, so use `working_dir`, absolute
      paths, or chain with `&&` inside a single command. The result is one
      text with a `== label ==` section per command, always in the order you
      listed them. A failing command is an `ERROR: exit N` section and the
      others still run.

      Reading code is a batch. Locate, then read the regions you need,
      across several files, in one call:
        commands: [
          {"command": "grep -n 'def run_handlers\|_pending_handler' lib/ansible/plugins/strategy/__init__.py", "label": "locate"},
          {"command": "sed -n '300,420p' lib/ansible/executor/play_iterator.py", "label": "play_iterator 300-420"},
          {"command": "sed -n '40,120p' lib/ansible/playbook/handler.py", "label": "handler 40-120"}
        ]
      Read a region rather than a whole file unless the file is small; what
      you read stays in context while you work on it.

      Each command's output is guaranteed a byte budget (default 64K, or its
      own `max_output_bytes`). A cut section says how many bytes were cut and
      how to narrow.

      Independent work is a batch: several greps, git status and diff.
      Dependent steps chain with `&&` inside one command: build && test.

      Single command: `command`. Working directory: `working_dir`.

    tags:
      - tool
      - shell
      - command
      - filesystem
    metadata:
      version: "v1.0"
      description: "Shell command execution tool"
