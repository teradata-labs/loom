---
name: tools
namespace: loom.file
---
prompts:
  - id: file_read
    content: |
      Read files. paths accepts globs (models/**/*.sql), so one call can read
      many files. With pattern, acts as a project-wide search returning matching
      lines (path:line). Use this for all file reading and searching.
      Max 10MB per file; won't read sensitive system paths.
    tags:
      - tool
      - file
      - read
    metadata:
      version: "v1.0"
      description: "File reading tool (DEPRECATED)"
      alternatives:
        - workspace
        - shell_execute

  - id: edit_files
    content: |
      Change lines inside existing files. Each edit replaces one exact
      occurrence of find with replace and fails loudly if find is absent or
      ambiguous. Use for targeted fixes; use file_write for new or fully
      reshaped files.
    tags:
      - tool
      - file
      - edit
    metadata:
      version: "v1.0"
      description: "Exact-match in-place file edits"

  - id: file_write
    content: |
      Write complete files: create or fully replace (replacing an existing file?
      read it first). files carries every file that is ready — batch all
      determined deliverables into one call. For line changes inside an existing
      file use edit_files; never rewrite a large file to change a few lines.
      Creates parent directories automatically; won't overwrite system files.
    tags:
      - tool
      - file
      - write
    metadata:
      version: "v1.0"
      description: "File writing tool (DEPRECATED)"
      alternatives:
        - workspace
        - shell_execute

  - id: list_files
    content: |
      List all files in the workspace. Use this when the user asks what files are available.
    tags:
      - tool
      - file
      - list
    metadata:
      version: "v1.0"
      description: "File listing tool"

  - id: delete_file
    content: |
      Delete a file from the workspace. Use this with caution and confirm with the user before deleting.
    tags:
      - tool
      - file
      - delete
    metadata:
      version: "v1.0"
      description: "File deletion tool"

  - id: search_files
    content: |
      Search for text across all files in the workspace. Returns files containing the search term with snippets.
    tags:
      - tool
      - file
      - search
    metadata:
      version: "v1.0"
      description: "File content search tool"

  - id: get_metadata
    content: |
      Get metadata about a file (size, modified date, permissions). Use this when the user asks about file properties.
    tags:
      - tool
      - file
      - metadata
    metadata:
      version: "v1.0"
      description: "File metadata inspection tool"
