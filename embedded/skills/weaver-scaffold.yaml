apiVersion: loom/v1
kind: Skill
metadata:
  name: weaver-scaffold
  title: Pro-Code SDK Agent Scaffolder
  description: |
    Guides the user through creating a pro-code agent (LangGraph, CrewAI,
    or AutoGen) via a structured conversation. Generates Python source files
    using embedded framework reference patterns and AgentRuntime deployment
    conventions, then packages them into a code.zip and registers the agent
    in the unified registry.
  domain: meta-agent
  version: "1.0.0"
trigger:
  mode: HYBRID
  slash_commands:
    - /scaffold
  keywords:
    - "langgraph agent"
    - "crewai agent"
    - "autogen agent"
    - "pro-code agent"
    - "python agent"
    - "scaffold an agent"
    - "sdk agent"
    - "code agent"
prompt:
  instructions: |
    ## Pro-Code Agent Scaffolding — 5-Step Flow

    When this skill activates, guide the user through these 5 steps in order.
    Do NOT write any files to disk until Step 5 is confirmed.

    ---

    ### Step 1 — Framework selection
    Ask: "Which framework?
      1. LangGraph  — state-machine graph; best for multi-step pipelines with
                      conditional routing
      2. CrewAI     — role-based agents in a crew; best for parallel
                      specialist teams
      3. AutoGen    — conversational multi-agent; best for back-and-forth
                      reasoning loops"

    Wait for the user's answer.

    ---

    ### Step 2 — Use-case & requirements
    Ask: "Describe what this agent should do, and list any external data
    sources or APIs it needs to call."

    Then ask: "Should it call any MCP servers? Call agent_management
    action='discover' and present the MCP server list."

    Ask: "Which LLM model? (Leave blank for workspace default.)"

    Wait for the user's answers.

    ---

    ### Step 3 — Generate scaffolding
    Generate the full Python package using the embedded reference patterns
    for the chosen framework (see FRAMEWORK REFERENCE PATTERNS below).

    For each file, show a brief summary. Ask: "Here is the scaffolded code.
    Reply 'yes' to package and publish, or tell me what to change."

    ---

    ### Step 4 — Package & publish
    Once confirmed:
    1. Use shell_execute to write each generated file to a temp directory
       under $LOOM_DATA_DIR/scaffold/{agent_name}/
    2. Call agent_management with action="package_code" passing the
       directory path. This zips the directory and uploads to S3.
    3. Confirm success to the user.

    Inform the user:
    "Your agent has been packaged and published to the unified registry as v1.
    To deploy it as a K8s pod, open the AgentRuntime deployment wizard,
    select the agent, choose version 1, and deploy."

    ---

    ## FRAMEWORK REFERENCE PATTERNS

    ### LangGraph

    **File structure:**
    ```
    main.py
    requirements.txt
    config.yaml
    ```

    **main.py template:**
    ```python
    """LangGraph agent — generated by Weaver."""
    from __future__ import annotations
    import os
    from typing import TypedDict, Annotated
    from langgraph.graph import StateGraph, END
    from langchain_anthropic import ChatAnthropic
    # MCP integration: tool_node wraps MCP tools as LangChain tools
    # from langchain_mcp_adapters.client import MultiServerMCPClient

    class AgentState(TypedDict):
        messages: Annotated[list, "append"]
        result: str

    # Node functions
    def agent_node(state: AgentState) -> AgentState:
        llm = ChatAnthropic(model=os.getenv("AGENT_MODEL", "claude-3-5-sonnet-20241022"))
        response = llm.invoke(state["messages"])
        return {"messages": [response], "result": response.content}

    # Build graph
    graph = StateGraph(AgentState)
    graph.add_node("agent", agent_node)
    graph.set_entry_point("agent")
    graph.add_edge("agent", END)
    app = graph.compile()

    # AgentRuntime entrypoint
    if __name__ == "__main__":
        import json, sys
        input_data = json.loads(os.getenv("AGENT_INPUT", "{}"))
        result = app.invoke({"messages": [{"role": "user", "content": input_data.get("message", "")}]})
        print(json.dumps({"output": result["result"]}))
    ```

    **requirements.txt template:**
    ```
    langgraph>=0.2.0
    langchain-anthropic>=0.3.0
    langchain-core>=0.3.0
    # langchain-mcp-adapters>=0.1.0  # uncomment if using MCP
    ```

    **config.yaml template:**
    ```yaml
    name: {agent_name}
    framework: langgraph
    model: claude-3-5-sonnet-20241022
    # mcp_servers:
    #   - name: my-server
    #     url: http://server:8001/mcp
    ```

    ---

    ### CrewAI

    **File structure:**
    ```
    main.py
    requirements.txt
    config.yaml
    ```

    **main.py template:**
    ```python
    """CrewAI agent — generated by Weaver."""
    from __future__ import annotations
    import os, json
    from crewai import Agent, Task, Crew, Process

    # Define specialist agents
    analyst = Agent(
        role="Data Analyst",
        goal="Analyse data and extract insights",
        backstory="Expert data analyst with deep domain knowledge",
        verbose=True,
        allow_delegation=False,
    )

    # Define tasks
    analyse_task = Task(
        description="Analyse the provided input: {input}",
        expected_output="A structured analysis with key findings",
        agent=analyst,
    )

    # Assemble crew
    crew = Crew(
        agents=[analyst],
        tasks=[analyse_task],
        process=Process.sequential,
        verbose=True,
    )

    # AgentRuntime entrypoint
    if __name__ == "__main__":
        input_data = json.loads(os.getenv("AGENT_INPUT", "{}"))
        result = crew.kickoff(inputs={"input": input_data.get("message", "")})
        print(json.dumps({"output": str(result)}))
    ```

    **requirements.txt template:**
    ```
    crewai>=0.80.0
    crewai-tools>=0.14.0
    ```

    ---

    ### AutoGen

    **File structure:**
    ```
    main.py
    requirements.txt
    config.yaml
    ```

    **main.py template:**
    ```python
    """AutoGen agent — generated by Weaver."""
    from __future__ import annotations
    import os, json
    from autogen import ConversableAgent

    llm_config = {
        "config_list": [
            {
                "model": os.getenv("AGENT_MODEL", "claude-3-5-sonnet-20241022"),
                "api_key": os.getenv("ANTHROPIC_API_KEY", ""),
                "api_type": "anthropic",
            }
        ]
    }

    assistant = ConversableAgent(
        name="assistant",
        system_message="You are a helpful AI assistant.",
        llm_config=llm_config,
    )

    user_proxy = ConversableAgent(
        name="user_proxy",
        human_input_mode="NEVER",
        max_consecutive_auto_reply=3,
    )

    # AgentRuntime entrypoint
    if __name__ == "__main__":
        input_data = json.loads(os.getenv("AGENT_INPUT", "{}"))
        result = user_proxy.initiate_chat(
            assistant,
            message=input_data.get("message", ""),
        )
        print(json.dumps({"output": result.summary}))
    ```

    **requirements.txt template:**
    ```
    pyautogen>=0.4.0
    ```

    ---

    ## AgentRuntime Deployment Contract

    Every pro-code agent MUST follow this contract to be deployable via
    AgentRuntime:

    **Entrypoint:** `python main.py`
    **Input:** Read from `os.getenv("AGENT_INPUT")` — JSON string
      - `message`: str — user input
      - `session_id`: str (optional)
      - Any other fields from the deployment runtime_config
    **Output:** Print a JSON string to stdout:
      - `output`: str — agent response
      - `error`: str (optional) — if the agent encountered an error
    **Health check:** The container must respond to `GET /health` on the
      service port (default 8080). Add a simple HTTP server or use the
      AgentRuntime sidecar (set `health_check: sidecar` in config.yaml).
    **Dockerfile (optional):** If not provided, AgentRuntime uses the
      default Python 3.11 base image and runs `pip install -r requirements.txt`
      then `python main.py`.

    ## MCP Integration Pattern (any framework)

    To call MCP tools from a Python agent:
    ```python
    import httpx, json

    MCP_URL = os.getenv("MCP_SERVER_URL", "http://mcp-server:8001/mcp")
    MCP_AUTH = os.getenv("MCP_AUTH_HEADER", "")

    def call_mcp_tool(tool_name: str, arguments: dict) -> dict:
        headers = {"Content-Type": "application/json"}
        if MCP_AUTH:
            headers["Authorization"] = MCP_AUTH
        payload = {
            "jsonrpc": "2.0", "id": 1,
            "method": "tools/call",
            "params": {"name": tool_name, "arguments": arguments}
        }
        resp = httpx.post(MCP_URL, json=payload, headers=headers, timeout=30)
        resp.raise_for_status()
        return resp.json().get("result", {})
    ```

  constraints:
    - Complete all 5 steps before writing any files to disk
    - Always confirm with the user before calling package_code
    - Use the exact framework templates above as the starting point
    - Customise imports, node names, agents, tasks to match the user's use-case
    - Never expose API keys in generated code — always use os.getenv()
    - Always include the AgentRuntime entrypoint (if __name__ == "__main__")
    - Always include requirements.txt and config.yaml

tools:
  required_tools:
    - agent_management
    - shell_execute
  preferred_order:
    - agent_management
    - tool_search
    - shell_execute
