apiVersion: loom/v1
kind: Skill
metadata:
  name: weaver-interactive
  title: Interactive Loom Agent Creator
  description: |
    Guides the user through a structured 6-step Q&A conversation to create
    a loom YAML agent (agent.yaml + optional skills). Produces a fully
    configured agent definition and triggers creation via
    agent_management.create_agent.
  domain: meta-agent
  version: "1.0.0"
trigger:
  mode: HYBRID
  slash_commands:
    - /create
  keywords:
    - "create an agent"
    - "build an agent"
    - "new agent"
    - "make an agent"
    - "set up an agent"
    - "create a loom agent"
prompt:
  instructions: |
    ## Interactive Agent Creation — 6-Step Flow

    When this skill activates, guide the user through EXACTLY these 6 steps
    in order. Do NOT skip steps. Do NOT generate the agent YAML until Step 6
    is confirmed.

    ---

    ### Step 1 — Use-case
    Ask: "What should this agent do? Give me a brief description of the goal
    and the kind of questions or tasks it should handle."

    Wait for the user's answer before proceeding to Step 2.

    ---

    ### Step 2 — Tools & MCP servers
    Call `agent_management` with action="discover" to get the full list of
    available tools and configured MCP servers.

    Present the results as two numbered lists:

      **Available tools:**
      1. tool_name_1 — short description
      2. tool_name_2 — short description
      ...

      **Configured MCP servers:**
      1. server-name (url)
      2. server-name (url)
      ...

    Ask: "Which tools and MCP servers should I enable? You can reply with
    numbers (e.g. '1, 3' for tools and '2' for MCP servers), or just
    describe what you need."

    Wait for the user's answer.

    ---

    ### Step 3 — Model / provider
    Call `tool_search` with query="llm providers" to discover configured
    providers. Present a numbered list.

    Ask: "Which LLM model should this agent use? (Leave blank to use the
    workspace default.)"

    Wait for the user's answer.

    ---

    ### Step 4 — Capabilities
    Present a numbered checklist of optional capabilities:

      1. Delegate to sub-agents — spawn focused sub-agents at runtime
         (adds manage_ephemeral_agents to tools.builtin)
      2. Persistent graph memory — remember facts across sessions
      3. Task board — track multi-step work as kanban tasks
      4. Enable self-correction — agent retries on tool errors

    Ask: "Which capabilities should I enable? (Enter numbers, or 'none'.)"

    Wait for the user's answer.

    ---

    ### Step 5 — Preview & confirm
    Generate the agent.yaml and show it in a code block:

    **agent.yaml:**
    ```yaml
    apiVersion: loom/v1
    kind: Agent
    metadata:
      name: {agent_name}
      description: {description}
    spec:
      system_prompt: |
        {the system prompt you created based on use-case}
      llm:  # only if user chose a specific model
        provider: {provider}
        model: {model}
      tools:
        - {tool1}
        - {tool2}
      config:
        max_turns: 500
        max_context_tokens: 200000
        max_tool_executions: 100
      memory:
        max_history: 1000
        # graph_memory:  # if persistent graph memory enabled
        #   enabled: true
        # task_board:    # if task board enabled
        #   enabled: true
    ```

    > **Note:** Server configuration is auto-generated internally during artifact
    > creation. Only the agent.yaml is shown in preview.

    Show the user the YAML preview, then ask:
    "Here is the agent configuration I'll create. Shall I go ahead?
    Reply 'yes' to create, or tell me what to change."

    If the user requests changes, update the YAML and show the revised preview.
    Repeat until the user confirms.

    ---

    ### Step 6 — Create
    Once confirmed, call agent_management with action="create_agent" passing
    the finalised YAML content.

    After creation succeeds:
    - Summarise what was created (agent name, tools, MCP servers, model,
      capabilities).
    - Inform the user: "The agent has been published to the registry. You
      can run it now by starting a new session, or deploy it as a standalone
      pod from the AgentRuntime wizard."
    - If skills were requested, ask: "Would you like me to create any custom
      skills for this agent?"

    ---

    ## Rules for the generated YAML
    - Follow ALL rules from the weaver-creation skill.
    - NEVER include llm: section unless the user explicitly chose a provider.
    - tools list is FLAT — no builtin:/mcp:/custom: nesting.
    - MCP servers go in a mcp_servers list if the agent spec supports it,
      otherwise they go in the tools list by server name.
    - Capabilities map to these fields:
        - delegate-to-sub-agents → add "manage_ephemeral_agents" to tools
        - graph memory           → memory.graph_memory.enabled: true
        - task board             → memory.task_board.enabled: true
        - self-correction        → config.enable_self_correction: true
    - Always set config.max_turns: 500 and config.max_context_tokens: 200000
      unless the user specifies otherwise.

  constraints:
    - Complete all 6 steps before writing to disk
    - Always confirm with user before calling create_agent
    - Do not hallucinate tool names — use discover action first
    - If discover returns no MCP servers, skip MCP part of Step 2 silently
    - Never include auto-injected tools in the YAML
    - Only show agent.yaml in preview — server config is auto-generated internally

tools:
  required_tools:
    - agent_management
  preferred_order:
    - agent_management
    - tool_search
    - shell_execute
